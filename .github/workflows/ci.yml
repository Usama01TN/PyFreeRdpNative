name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Lint + unit tests on every push, no native FreeRDP needed. Runs on all
  # three host OSes to catch platform-specific candidate-list / loader bugs.
  # ---------------------------------------------------------------------------
  unit:
    name: unit (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.8 is the floor: f-strings would force 3.6+ but we don't use
        # them; class-attribute access patterns we use work all the way
        # back. We still pick 3.8 as the floor since older Pythons have
        # been EOL for a long time.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: |
          ruff check pyfreerdp tests
      - name: Static syntax check (no Py3-only features)
        # We deliberately keep the source Py2-syntax-compatible. This step
        # asserts no f-string, annotation, dataclass, walrus, or match
        # leaked back in.
        run: |
          python scripts/check_py2_syntax.py
      - name: Unit tests (no native lib)
        run: |
          pytest -v -m "not needs_lib"

  # ---------------------------------------------------------------------------
  # Integration: install FreeRDP from apt (client + server + winpr), then
  # run the needs_lib-marked tests so we exercise the loader and the
  # bind_client / bind_server / bind_winpr paths against a real shared library.
  # ---------------------------------------------------------------------------
  integration-linux:
    name: integration (linux, system FreeRDP)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FreeRDP from apt (client + server + winpr)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfreerdp-client3-3 \
            libfreerdp-server3-3 \
            libfreerdp3-3 \
            libwinpr3-3
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run needs_lib tests
        run: |
          pytest -v -m needs_lib
      - name: Confirm all three halves loadable
        run: |
          python -c "
          import pyfreerdp
          c = pyfreerdp.find_freerdp_library()
          s = pyfreerdp.find_freerdp_server_library()
          w = pyfreerdp.find_winpr_library()
          print('client:', c)
          print('server:', s)
          print('winpr: ', w)
          assert c, 'client lib not found'
          assert s, 'server lib not found'
          assert w, 'winpr lib not found'
          "

  # ---------------------------------------------------------------------------
  # Build FreeRDP from source with --profile=full and verify all libraries
  # (client, server, winpr) plus the client/server channels land in
  # pyfreerdp/_libs/. Runs on every push / PR / manual dispatch: an earlier
  # version gated this on "did scripts/build_freerdp.py change?", and both
  # the head_commit.modified check and a paths-filter job skipped it when it
  # should have run. ~10 min on a 4-core runner is cheaper than a silently
  # skipped build.
  # ---------------------------------------------------------------------------
  build-from-source:
    name: build FreeRDP from source (--profile=full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FreeRDP build deps (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libssl-dev zlib1g-dev libkrb5-dev libcjson-dev libicu-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxfixes-dev libxcursor-dev libxi-dev libxv-dev \
            libxkbfile-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols \
            libasound2-dev libpng-dev libjpeg-dev libcairo2-dev \
            nasm libudev-dev libv4l-dev xvfb patchelf
      - name: Cache dependency prefix (libusb, OpenH264, FFmpeg)
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/deps/linux-x86_64
          key: deps-v1-linux-x86_64-${{ hashFiles('scripts/build_deps.py', 'scripts/vcpkg.json') }}
      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/build_deps.py --target host --jobs "$(nproc)"
      - name: Show channel plan
        run: |
          python scripts/build_freerdp.py --list-channels --profile full \
            --enable-channel urbdrc --enable-channel rdpecam
      - name: Build FreeRDP (full profile, with FFmpeg/OpenH264/libusb + executables)
        run: |
          python scripts/build_freerdp.py --target host --profile full \
            --deps-prefix build/deps/linux-x86_64 --with-executables --jobs "$(nproc)"
      - name: Assert all halves staged
        run: |
          ls -1 pyfreerdp/_libs/ | tee /tmp/libs.txt
          grep -q 'freerdp-client' /tmp/libs.txt
          grep -q 'freerdp-server' /tmp/libs.txt
          grep -q 'winpr' /tmp/libs.txt
      - name: Assert client + server channels compiled in
        run: |
          set -e
          # Server channels are exported; client channels live in a static
          # entry table with hidden visibility, so look at all symbols.
          for sym in cliprdr_server_context_new rdpsnd_server_context_new \
                     rdpgfx_server_context_new rail_server_context_new \
                     drdynvc_server_context_new disp_server_context_new; do
            nm -D --defined-only pyfreerdp/_libs/libfreerdp-server3.so | grep -q " $sym$" \
              || { echo "::error::server channel symbol missing: $sym"; exit 1; }
          done
          for sym in cliprdr_VirtualChannelEntryEx drdynvc_VirtualChannelEntryEx \
                     rdpgfx_DVCPluginEntry disp_DVCPluginEntry drive_DeviceServiceEntry; do
            nm --defined-only pyfreerdp/_libs/libfreerdp-client3.so | grep -q " $sym$" \
              || { echo "::error::client channel symbol missing: $sym"; exit 1; }
          done
          echo "client + server channels present"
      - name: Validate (media, executables, loopback session)
        run: |
          python scripts/validate_build.py --profile full --media --executables --loopback
      - name: Run full test matrix against bundled libs
        run: |
          pip install -e .[dev]
          pytest -v
