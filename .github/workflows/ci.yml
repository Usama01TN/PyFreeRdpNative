# Fast checks on every push / PR: the generated bindings import and are
# self-consistent, the scripts agree on their version, and the examples parse.
# Building FreeRDP itself is build-freerdp.yml's job.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Pure-Python tests on every supported interpreter and OS. No FreeRDP
  # libraries are present here, so the needs_lib tests skip.
  # ---------------------------------------------------------------------------
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-15
            python: "3.8"      # no arm64 build of 3.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip pytest
      - name: Build scripts are version-consistent
        shell: bash
        run: |
          for s in build_freerdp build_deps validate_build; do
            python scripts/$s.py --require-version 43
          done
          python scripts/package_wheels.py --require-version 4
      - name: Py2-compatible syntax in the hand-written code
        run: python scripts/check_py2_syntax.py
      - name: Unit tests
        run: pytest -v -m "not needs_lib"
      - name: Examples compile
        shell: bash
        run: python -m compileall -q examples

  # ---------------------------------------------------------------------------
  # Lint the hand-written code (generated modules are excluded in pyproject).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check scripts tests examples pyfreerdpnative/__init__.py pyfreerdpnative/_loader.py

  # ---------------------------------------------------------------------------
  # The committed bindings must match what the generator produces from the
  # FreeRDP tag build-freerdp.yml builds - otherwise layouts drift from the
  # libraries. Regenerate and diff.
  # ---------------------------------------------------------------------------
  bindings-up-to-date:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          python -m pip install pycparser
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            cmake gcc libssl-dev zlib1g-dev libcjson-dev
      - name: Regenerate from the pinned FreeRDP tag
        shell: bash
        run: |
          set -e
          # build-freerdp.yml: FREERDP_REF: ${{ inputs.freerdp_ref || '3.31.1' }} -> the default
          ref=$(grep -oE "freerdp_ref \|\| '[^']+'" .github/workflows/build-freerdp.yml | head -1 | grep -oE "'[^']+'" | tr -d "'")
          test -n "$ref" || { echo "::error::could not read the FreeRDP tag from build-freerdp.yml"; exit 1; }
          echo "FreeRDP tag: $ref"
          git clone -q --depth=1 --branch "$ref" https://github.com/FreeRDP/FreeRDP.git /tmp/src
          cmake -S /tmp/src -B /tmp/cfg -DWITH_CLIENT=OFF -DWITH_SERVER=ON -DWITH_SAMPLE=OFF \
            -DWITH_MANPAGES=OFF -DBUILD_TESTING=OFF -DWITH_X11=OFF -DWITH_WAYLAND=OFF \
            -DWITH_FFMPEG=OFF -DWITH_SWSCALE=OFF -DWITH_DSP_FFMPEG=OFF -DWITH_CAIRO=OFF \
            -DWITH_OPENH264=OFF -DWITH_INTERNAL_MD4=ON -DWITH_INTERNAL_MD5=ON -DWITH_INTERNAL_RC4=ON \
            -DWITH_KRB5=OFF -DWITH_PROXY=OFF -DWITH_SHADOW=OFF -DWITH_CHANNELS=OFF -DWITH_FUSE=OFF \
            -DWITH_PULSE=OFF -DWITH_ALSA=OFF -DWITH_CUPS=OFF -DWITH_PCSC=OFF > /tmp/cfg.log 2>&1 \
            || { tail -20 /tmp/cfg.log; exit 1; }
          python scripts/gen_bindings.py \
            --include /tmp/src/include --include /tmp/src/winpr/include \
            --include /tmp/cfg/include --include /tmp/cfg/winpr/include \
            --out /tmp/regen --version "$ref"
      - name: Compare with the committed package
        shell: bash
        run: |
          # _libs is data, __pycache__ is noise; everything else must be identical
          if ! diff -r -x _libs -x __pycache__ -x '*.pyc' /tmp/regen pyfreerdpnative > /tmp/bindings.diff; then
            echo "::error::pyfreerdpnative/ differs from a fresh generation - run scripts/gen_bindings.py and commit"
            head -60 /tmp/bindings.diff
            exit 1
          fi
          echo "committed bindings match the generator output"
