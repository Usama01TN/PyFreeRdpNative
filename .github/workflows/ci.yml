# Fast checks on every push / PR: the generated bindings import and are
# self-consistent, the scripts agree on their version, and the examples parse.
# Building FreeRDP itself is build-freerdp.yml's job.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Pure-Python tests on every supported interpreter and OS. No FreeRDP
  # libraries are present here, so the needs_lib tests skip.
  # ---------------------------------------------------------------------------
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-15
            python: "3.8"      # no arm64 build of 3.8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install --upgrade pip pytest
      - name: Build scripts are version-consistent
        shell: bash
        run: |
          for s in build_freerdp build_deps validate_build; do
            python scripts/$s.py --require-version 43
          done
          python scripts/package_wheels.py --require-version 4
      - name: Py2-compatible syntax in the hand-written code
        run: python scripts/check_py2_syntax.py
      - name: Unit tests
        run: pytest -v -m "not needs_lib"
      - name: Examples compile
        shell: bash
        run: python -m compileall -q examples

  # ---------------------------------------------------------------------------
  # Lint the hand-written code (generated modules are excluded in pyproject).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check scripts tests examples pyfreerdpnative/__init__.py pyfreerdpnative/_loader.py

  # ---------------------------------------------------------------------------
  # The committed bindings must match what the generator produces from the
  # FreeRDP tag build-freerdp.yml builds - otherwise layouts drift from the
  # libraries. Regenerate and diff.
  # ---------------------------------------------------------------------------
  bindings-up-to-date:
    # The committed bindings must match what the generator produces from the
    # FreeRDP tag build-freerdp.yml builds. Regenerating needs cpp/cmake on
    # Linux, which a Windows workstation does not have, so this job is the
    # canonical regenerator: on a push to main it COMMITS the regenerated
    # package back ([skip ci] avoids a second run); on a pull request it fails
    # and attaches the fresh package as an artifact to download and commit.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          python -m pip install pycparser
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            cmake gcc libssl-dev zlib1g-dev libcjson-dev
      - name: Regenerate from the pinned FreeRDP tag
        shell: bash
        run: |
          set -e
          # build-freerdp.yml: FREERDP_REF: ${{ inputs.freerdp_ref || '3.31.1' }} -> the default
          ref=$(grep -oE "freerdp_ref \|\| '[^']+'" .github/workflows/build-freerdp.yml | head -1 | grep -oE "'[^']+'" | tr -d "'")
          test -n "$ref" || { echo "::error::could not read the FreeRDP tag from build-freerdp.yml"; exit 1; }
          echo "FreeRDP tag: $ref"
          git clone -q --depth=1 --branch "$ref" https://github.com/FreeRDP/FreeRDP.git /tmp/src
          cmake -S /tmp/src -B /tmp/cfg -DWITH_CLIENT=OFF -DWITH_SERVER=ON -DWITH_SAMPLE=OFF \
            -DWITH_MANPAGES=OFF -DBUILD_TESTING=OFF -DWITH_X11=OFF -DWITH_WAYLAND=OFF \
            -DWITH_FFMPEG=OFF -DWITH_SWSCALE=OFF -DWITH_DSP_FFMPEG=OFF -DWITH_CAIRO=OFF \
            -DWITH_OPENH264=OFF -DWITH_INTERNAL_MD4=ON -DWITH_INTERNAL_MD5=ON -DWITH_INTERNAL_RC4=ON \
            -DWITH_KRB5=OFF -DWITH_PROXY=OFF -DWITH_SHADOW=OFF -DWITH_CHANNELS=OFF -DWITH_FUSE=OFF \
            -DWITH_PULSE=OFF -DWITH_ALSA=OFF -DWITH_CUPS=OFF -DWITH_PCSC=OFF > /tmp/cfg.log 2>&1 \
            || { tail -20 /tmp/cfg.log; exit 1; }
          python scripts/gen_bindings.py \
            --include /tmp/src/include --include /tmp/src/winpr/include \
            --include /tmp/cfg/include --include /tmp/cfg/winpr/include \
            --out /tmp/regen --version "$ref"
      - name: Compare with the committed package
        id: compare
        shell: bash
        run: |
          # _libs is data, __pycache__ is noise; everything else must be identical
          if diff -r -x _libs -x __pycache__ -x '*.pyc' /tmp/regen pyfreerdpnative > /tmp/bindings.diff; then
            echo "committed bindings match the generator output"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # NB: this step runs with `set -e -o pipefail`; diff exits 1 when
          # files differ and grep exits 1 with no match, so every reporting
          # pipeline below must be neutralised with `|| true` or it aborts the
          # step before the package is staged.
          echo "--- files that differ:"
          { diff -rq -x _libs -x __pycache__ -x '*.pyc' /tmp/regen pyfreerdpnative || true; } | sed 's/^/  /'
          echo "--- first differences (long lines cut):"
          { grep -E '^[<>]' /tmp/bindings.diff || true; } | cut -c1-160 | head -40
          # stage the regenerated package in place (keeps _libs untouched)
          find pyfreerdpnative -mindepth 1 -maxdepth 1 ! -name _libs -exec rm -rf {} + || true
          cp -r /tmp/regen/. pyfreerdpnative/
          find pyfreerdpnative -name __pycache__ -type d -prune -exec rm -rf {} + || true
          python -c "import pyfreerdpnative, pyfreerdpnative.freerdp.freerdp"   # must import
          echo "regenerated package staged"
      - name: Upload the regenerated package (pull requests)
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pyfreerdpnative-regenerated
          path: |
            pyfreerdpnative
            !pyfreerdpnative/_libs
      - name: Commit the regenerated package (push to main)
        if: steps.compare.outputs.changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pyfreerdpnative
          git commit -m "chore: regenerate pyfreerdpnative bindings from scripts/gen_bindings.py [skip ci]"
          git push
          echo "regenerated bindings committed"
      - name: Fail on a pull request (the artifact above is the fix)
        if: steps.compare.outputs.changed == 'true' && github.event_name != 'push'
        run: |
          echo "::error::pyfreerdpnative/ differs from a fresh generation. Download the 'pyfreerdpnative-regenerated' artifact and commit it, or merge to main and the job commits it for you."
          exit 1
