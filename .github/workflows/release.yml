# Publish the wheels produced by a build-freerdp run to PyPI (or TestPyPI).
#
# build-freerdp.yml builds the libraries, generates the bindings from the same
# FreeRDP checkout, packages one wheel per platform and variant, and attaches
# them to the freerdp-libs-<ref> GitHub release. This workflow takes those
# wheels and uploads them to an index. Run it manually with the run id of a
# green build-freerdp run.
name: release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run id of the build-freerdp workflow whose wheels to publish"
        required: true
        type: string
      repository:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
      packages:
        description: "Comma-separated pip package names to publish (blank = all variants)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write        # trusted publishing (no API token needed)
  actions: read          # download artifacts of another run

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the wheels from the build run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: "{pyfreerdpnative-*,pyfreerdpnative_*}"
          path: dl/

      - name: Select what to publish
        shell: bash
        run: |
          set -e
          mkdir -p dist
          find dl -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec mv {} dist/ \;
          if [ -n "${{ inputs.packages }}" ]; then
            keep=$(echo "${{ inputs.packages }}" | tr ',' '\n' | sed 's/-/_/g; s/ //g')
            for f in dist/*; do
              name=$(basename "$f" | sed -E 's/^([A-Za-z0-9_]+)-[0-9].*/\1/')
              echo "$keep" | grep -qx "$name" || rm -f "$f"
            done
          fi
          ls -lh dist/
          test "$(ls dist | wc -l)" -gt 0 || { echo "::error::nothing to publish"; exit 1; }
          python -m pip install -q twine && twine check dist/*

      - name: Publish to TestPyPI
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
